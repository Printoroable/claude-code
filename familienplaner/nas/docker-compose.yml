# Familienplaner mit dem fertigen Image aus der GitHub Container Registry.
# Diese Datei allein genügt – z. B. in der Docker-App der NAS unter
# „Projekt → Erstellen“ einfügen und das Passwort anpassen.
services:
  familienplaner:
    image: ghcr.io/printoroable/familienplaner:latest
    container_name: familienplaner
    restart: unless-stopped
    ports:
      - "3000:3000"            # links den Port ändern, falls 3000 belegt ist
    environment:
      APP_PASSWORD: "BitteAendern"   # Familien-Passwort
      TZ: "Europe/Berlin"
      MAX_UPLOAD_MB: "25"
    volumes:
      - familienplaner-data:/data

volumes:
  familienplaner-data:

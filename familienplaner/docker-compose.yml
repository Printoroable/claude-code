services:
  familienplaner:
    build: .
    image: familienplaner:latest
    container_name: familienplaner
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Familien-Passwort. Leer lassen = kein Login (nur im Heimnetz empfehlenswert).
      APP_PASSWORD: "${APP_PASSWORD:-}"
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - familienplaner-data:/data

volumes:
  familienplaner-data:

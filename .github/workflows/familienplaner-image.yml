# Baut das Docker-Image des Familienplaners und veröffentlicht es
#  - in der GitHub Container Registry als ghcr.io/<owner>/familienplaner:latest
#  - und auf Docker Hub als <dockerhub-name>/familienplaner:latest, sobald die
#    Repository-Secrets DOCKERHUB_USERNAME und DOCKERHUB_TOKEN gesetzt sind.
# So kann z. B. eine NAS das Image einfach herunterladen bzw. finden.
name: Familienplaner Docker-Image

on:
  push:
    branches:
      - main
      - claude/familienplaner-timetree-docker-qedbes
    paths:
      - "familienplaner/**"
      - ".github/workflows/familienplaner-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: familienplaner-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
        working-directory: familienplaner

      - name: Image-Namen bestimmen
        id: meta
        run: |
          # GHCR verlangt Kleinbuchstaben
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tags="ghcr.io/${owner}/familienplaner:latest,ghcr.io/${owner}/familienplaner:${GITHUB_SHA}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            hub="${DOCKERHUB_USERNAME,,}/familienplaner"
            tags="${tags},${hub}:latest,${hub}:${GITHUB_SHA}"
          else
            echo "::notice::DOCKERHUB_USERNAME ist nicht gesetzt – Docker Hub wird übersprungen."
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bei Docker Hub anmelden
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: familienplaner
          # Intel/AMD-NAS (z. B. UGREEN DXP) und ARM-Geräte (z. B. Raspberry Pi)
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Familienplaner
            org.opencontainers.image.description=Geteilter Familienkalender im TimeTree-Stil
